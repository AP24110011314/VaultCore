server:
  port: ${PORT:8080}

spring:
  application:
    name: vaultcore

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultcore}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    custom-css-path: /css/swagger-custom.css

vaultcore:
  seed:
    enabled: ${VAULTCORE_SEED_ENABLED:${WALLET_SEED_ENABLED:true}}
